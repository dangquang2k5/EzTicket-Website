spring:
  # --- SCRUM-19: doc bien moi truong tu file .env local (khong commit) ---
  config:
    import: optional:file:.env[.properties]

  application:
    name: ezticket-backend

  # --- KÍCH HOẠT VIRTUAL THREADS (JAVA 21) ---
  threads:
    virtual:
      enabled: true

  # --- KẾT NỐI DATABASE NEON.TECH (SCRUM-19: qua bien moi truong, ho tro SSL) ---
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # --- CẤU HÌNH HIBERNATE / JPA ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- CẤU HÌNH FLYWAY MIGRATION ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # --- KẾT NỐI REDIS LOCAL ---
  data:
    redis:
      host: localhost
      port: 6379

# --- CẤU HÌNH JWT & BẢO MẬT (SCRUM-19: secret qua bien moi truong) ---
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
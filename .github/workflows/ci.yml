name: EzTicket Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ứng dụng (Bỏ qua Unit Test liên quan DB local)
        # BẮT BUỘC: Trỏ vào thư mục chứa mã nguồn Spring Boot
        working-directory: ./ezticket-backend
        run: mvn clean verify -DskipTests